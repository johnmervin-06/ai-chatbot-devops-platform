<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Chatbot</title>

<style>

/* Reset */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* Main page */

body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #212121;
    color: white;
    height: 100vh;
    overflow: hidden;
}


/* Main application */

.app {
    display: flex;
    height: 100vh;
}


/* Sidebar */

.sidebar {

    width: 260px;

    background-color: #171717;

    padding: 15px;

    display: flex;

    flex-direction: column;

    border-right: 1px solid #333;

}


/* New chat button */

.new-chat {

    width: 100%;

    padding: 13px;

    background-color: #242424;

    color: white;

    border: 1px solid #444;

    border-radius: 10px;

    font-size: 15px;

    cursor: pointer;

    text-align: left;

}


.new-chat:hover {

    background-color: #333;

}


/* History */

.history-title {

    margin-top: 25px;

    margin-bottom: 10px;

    padding-left: 10px;

    font-size: 12px;

    color: #999;

}


.history-item {

    padding: 12px;

    border-radius: 8px;

    color: #ddd;

    cursor: pointer;

}


.history-item:hover {

    background-color: #2a2a2a;

}


/* Sidebar bottom */

.sidebar-bottom {

    margin-top: auto;

    padding: 15px;

    border-top: 1px solid #333;

    color: #aaa;

    line-height: 1.6;

}


/* Main chat area */

.chat-area {

    flex: 1;

    display: flex;

    flex-direction: column;

    min-width: 0;

}


/* Top navigation */

.topbar {

    height: 60px;

    display: flex;

    align-items: center;

    padding-left: 25px;

    border-bottom: 1px solid #333;

    font-size: 18px;

    font-weight: bold;

}


.online {

    margin-left: 10px;

    color: #10a37f;

    font-size: 12px;

}


/* Messages */

.messages {

    flex: 1;

    overflow-y: auto;

    padding: 30px 15%;

}


/* Welcome section */

.welcome {

    max-width: 700px;

    margin: 100px auto;

    text-align: center;

}


.welcome h1 {

    font-size: 40px;

    margin-bottom: 15px;

}


.welcome p {

    color: #aaa;

    font-size: 17px;

}


/* Example boxes */

.examples {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 15px;

    margin-top: 35px;

}


.example {

    background-color: #2a2a2a;

    padding: 20px;

    border-radius: 12px;

    text-align: left;

    cursor: pointer;

    color: #ddd;

}


.example:hover {

    background-color: #383838;

}


/* Chat messages */

.message {

    display: flex;

    gap: 15px;

    max-width: 900px;

    margin: 0 auto 30px;

    line-height: 1.6;

}


.avatar {

    width: 38px;

    height: 38px;

    min-width: 38px;

    border-radius: 50%;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 12px;

    font-weight: bold;

}


.user-avatar {

    background-color: #555;

}


.bot-avatar {

    background-color: #10a37f;

}


.message-text {

    padding-top: 7px;

    white-space: pre-wrap;

    word-break: break-word;

}


/* Input area */

.input-area {

    padding: 20px 15% 25px;

}


.input-box {

    max-width: 900px;

    margin: auto;

    background-color: #303030;

    border: 1px solid #444;

    border-radius: 25px;

    display: flex;

    align-items: flex-end;

    padding: 8px 10px 8px 18px;

}


textarea {

    flex: 1;

    min-height: 30px;

    max-height: 150px;

    padding: 8px;

    border: none;

    outline: none;

    resize: none;

    background: transparent;

    color: white;

    font-size: 16px;

    font-family: Arial, Helvetica, sans-serif;

}


/* Send button */

.send-button {

    width: 42px;

    height: 42px;

    border: none;

    border-radius: 50%;

    background-color: #10a37f;

    color: white;

    font-size: 22px;

    cursor: pointer;

}


.send-button:hover {

    background-color: #0d8c6d;

}


.send-button:disabled {

    background-color: #555;

    cursor: not-allowed;

}


/* Bottom message */

.note {

    text-align: center;

    color: #777;

    font-size: 12px;

    margin-top: 10px;

}


/* Mobile design */

@media screen and (max-width: 700px) {

    .sidebar {

        display: none;

    }

    .messages {

        padding: 20px 15px;

    }

    .input-area {

        padding: 15px;

    }

    .welcome {

        margin: 70px 15px;

    }

    .welcome h1 {

        font-size: 30px;

    }

    .examples {

        grid-template-columns: 1fr;

    }

}

</style>

</head>


<body>


<div class="app">


<!-- Sidebar -->

<div class="sidebar">


<button class="new-chat" onclick="newChat()">

＋ New chat

</button>


<div class="history-title">

CHAT HISTORY

</div>


<div class="history-item">

AI Chatbot Conversation

</div>


<div class="sidebar-bottom">

🤖 AI Chatbot

<br>

DevOps Project

</div>


</div>



<!-- Main chatbot -->

<div class="chat-area">


<div class="topbar">

AI Chatbot

<span class="online">

● Online

</span>

</div>



<!-- Chat messages -->

<div class="messages" id="messages">


<div class="welcome" id="welcome">


<h1>

How can I help you?

</h1>


<p>

Ask anything and start chatting with your AI assistant.

</p>


<div class="examples">


<div class="example"

onclick="useExample('Explain cloud computing')">

Explain cloud computing

</div>


<div class="example"

onclick="useExample('What is DevOps?')">

What is DevOps?

</div>


<div class="example"

onclick="useExample('Explain Docker in simple words')">

Explain Docker

</div>


<div class="example"

onclick="useExample('What is Kubernetes?')">

What is Kubernetes?

</div>


</div>


</div>


</div>



<!-- Message input -->

<div class="input-area">


<div class="input-box">


<textarea

id="userInput"

placeholder="Message AI Chatbot..."

rows="1"

></textarea>


<button

id="sendButton"

class="send-button"

onclick="sendMessage()"

>

↑

</button>


</div>


<div class="note">

AI Chatbot may make mistakes. Check important information.

</div>


</div>


</div>


</div>



<script>


/*

LOCAL BACKEND URL

Keep this while testing locally.

After hosting your Flask backend on Render,
replace this with your Render URL.

Example:

const API_URL =
"https://your-backend.onrender.com/chat";

*/


const API_URL =

"http://127.0.0.1:5000/chat";


const input =

document.getElementById("userInput");


const messages =

document.getElementById("messages");


const welcome =

document.getElementById("welcome");


const sendButton =

document.getElementById("sendButton");


/* Send message using Enter */

input.addEventListener(

"keydown",

function(event) {


if (

event.key === "Enter"

&&

!event.shiftKey

) {


event.preventDefault();


sendMessage();


}


}

);


/* Automatically resize text box */

input.addEventListener(

"input",

function() {


this.style.height = "auto";


this.style.height =

Math.min(

this.scrollHeight,

150

)

+ "px";


}

);


/* Use example message */

function useExample(text) {


input.value = text;


sendMessage();


}


/* Add message to screen */

function addMessage(

text,

sender

) {


const message =

document.createElement("div");


message.className =

"message";


const avatar =

document.createElement("div");


avatar.className =

sender === "user"

?

"avatar user-avatar"

:

"avatar bot-avatar";


avatar.textContent =

sender === "user"

?

"YOU"

:

"AI";


const content =

document.createElement("div");


content.className =

"message-text";


content.textContent = text;


message.appendChild(

avatar

);


message.appendChild(

content

);


messages.appendChild(

message

);


messages.scrollTop =

messages.scrollHeight;


return content;


}


/* Send message to Flask */

async function sendMessage() {


const userMessage =

input.value.trim();


if (

userMessage === ""

) {


return;


}


/* Hide welcome screen */

welcome.style.display =

"none";


/* Show user message */

addMessage(

userMessage,

"user"

);


/* Clear input */

input.value = "";


input.style.height =

"auto";


sendButton.disabled =

true;


/* Show loading */

const loading =

addMessage(

"Thinking...",

"bot"

);


try {


const response =

await fetch(

API_URL,

{


method:

"POST",


headers: {


"Content-Type":

"application/json"


},


body:

JSON.stringify(

{


message:

userMessage


}

)


}

);


if (

!response.ok

) {


throw new Error(

"Backend error"

);


}


const data =

await response.json();


loading.textContent =

data.response

||

data.reply

||

data.message

||

"No response received.";


}


catch(error) {


console.error(

error

);


loading.textContent =

"Unable to connect to the backend. "

+

"Make sure Flask is running "

+

"on port 5000.";


}


sendButton.disabled =

false;


input.focus();


}


/* New chat */

function newChat() {


location.reload();


}


</script>


</body>

</html>
