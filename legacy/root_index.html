<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Chatbot</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #212121;
    color: #ececec;
    height: 100vh;
    overflow: hidden;
}

/* Main application */

.app {
    display: flex;
    height: 100vh;
}

/* Sidebar */

.sidebar {
    width: 260px;
    background: #171717;
    padding: 14px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #303030;
}

.new-chat {
    width: 100%;
    padding: 13px;
    border: 1px solid #444;
    border-radius: 10px;
    background: transparent;
    color: white;
    font-size: 15px;
    cursor: pointer;
    text-align: left;
}

.new-chat:hover {
    background: #2a2a2a;
}

.history-title {
    margin: 25px 10px 10px;
    font-size: 12px;
    color: #999;
}

.history-item {
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    color: #ddd;
    font-size: 14px;
}

.history-item:hover {
    background: #292929;
}

.sidebar-bottom {
    margin-top: auto;
    padding: 12px;
    border-top: 1px solid #333;
    color: #aaa;
    font-size: 14px;
}

/* Chat section */

.chat-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.topbar {
    height: 60px;
    display: flex;
    align-items: center;
    padding: 0 25px;
    font-size: 18px;
    font-weight: bold;
    border-bottom: 1px solid #303030;
}

.status {
    margin-left: 10px;
    color: #10a37f;
    font-size: 12px;
    font-weight: normal;
}

/* Messages */

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 30px 15%;
}

.message {
    display: flex;
    gap: 16px;
    max-width: 900px;
    margin: 0 auto 30px;
    line-height: 1.6;
}

.avatar {
    width: 34px;
    height: 34px;
    min-width: 34px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 14px;
    font-weight: bold;
}

.user-avatar {
    background: #555;
}

.bot-avatar {
    background: #10a37f;
}

.message-content {
    padding-top: 4px;
    white-space: pre-wrap;
    word-wrap: break-word;
}

/* Welcome screen */

.welcome {
    max-width: 700px;
    margin: 12vh auto;
    text-align: center;
}

.welcome h1 {
    font-size: 38px;
    margin-bottom: 15px;
}

.welcome p {
    color: #aaa;
    font-size: 17px;
}

.examples {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 35px;
}

.example {
    background: #2a2a2a;
    padding: 18px;
    border-radius: 12px;
    text-align: left;
    cursor: pointer;
    color: #ddd;
}

.example:hover {
    background: #353535;
}

/* Input */

.input-area {
    padding: 20px 15% 28px;
    background: #212121;
}

.input-box {
    max-width: 900px;
    margin: auto;
    background: #303030;
    border: 1px solid #444;
    border-radius: 22px;
    display: flex;
    align-items: flex-end;
    padding: 8px 10px 8px 18px;
}

textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 16px;
    resize: none;
    min-height: 28px;
    max-height: 150px;
    padding: 8px 5px;
    font-family: Arial, Helvetica, sans-serif;
}

.send-button {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: #10a37f;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.send-button:hover {
    background: #0d8c6d;
}

.send-button:disabled {
    background: #555;
    cursor: not-allowed;
}

.note {
    text-align: center;
    color: #777;
    font-size: 12px;
    margin-top: 10px;
}

/* Mobile */

.menu-button {
    display: none;
}

@media (max-width: 700px) {

    .sidebar {
        display: none;
    }

    .messages {
        padding: 25px 15px;
    }

    .input-area {
        padding: 15px;
    }

    .welcome {
        margin: 8vh 15px;
    }

    .welcome h1 {
        font-size: 30px;
    }

    .examples {
        grid-template-columns: 1fr;
    }

    .menu-button {
        display: block;
        margin-right: 15px;
    }

}

</style>
</head>

<body>

<div class="app">

    <!-- Sidebar -->

    <aside class="sidebar">

        <button class="new-chat" onclick="newChat()">
            ＋ New chat
        </button>

        <div class="history-title">
            CHAT HISTORY
        </div>

        <div id="history">

            <div class="history-item">
                AI Chatbot Conversation
            </div>

        </div>

        <div class="sidebar-bottom">
            🤖 AI Chatbot<br>
            DevOps Project
        </div>

    </aside>


    <!-- Main chat -->

    <main class="chat-section">

        <header class="topbar">

            AI Chatbot

            <span class="status">
                ● Online
            </span>

        </header>


        <!-- Messages -->

        <section class="messages" id="messages">

            <div class="welcome" id="welcome">

                <h1>How can I help you?</h1>

                <p>
                    Ask anything and start chatting with your AI assistant.
                </p>

                <div class="examples">

                    <div class="example"
                    onclick="useExample('Explain cloud computing')">

                        Explain cloud computing

                    </div>

                    <div class="example"
                    onclick="useExample('What is DevOps?')">

                        What is DevOps?

                    </div>

                    <div class="example"
                    onclick="useExample('Explain Docker in simple words')">

                        Explain Docker

                    </div>

                    <div class="example"
                    onclick="useExample('What is Kubernetes?')">

                        What is Kubernetes?

                    </div>

                </div>

            </div>

        </section>


        <!-- Input -->

        <section class="input-area">

            <div class="input-box">

                <textarea
                    id="userInput"
                    placeholder="Message AI Chatbot..."
                    rows="1"
                ></textarea>

                <button
                    id="sendButton"
                    class="send-button"
                    onclick="sendMessage()"
                >
                    ↑
                </button>

            </div>

            <p class="note">

                AI Chatbot may make mistakes. Check important information.

            </p>

        </section>

    </main>

</div>


<script>

/*
IMPORTANT:

After deploying your Flask backend to Render,
replace the URL below.

Example:

const API_URL =
"https://ai-chatbot-backend.onrender.com/chat";

*/

const API_URL = "http://127.0.0.1:5000/chat";


const input = document.getElementById("userInput");

const messages = document.getElementById("messages");

const welcome = document.getElementById("welcome");

const sendButton = document.getElementById("sendButton");


/* Automatically increase textarea height */

input.addEventListener("input", function () {

    this.style.height = "auto";

    this.style.height =
    Math.min(this.scrollHeight, 150) + "px";

});


/* Enter sends message */

input.addEventListener("keydown", function(event) {

    if (
        event.key === "Enter"
        &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();

    }

});


function useExample(text) {

    input.value = text;

    sendMessage();

}


function addMessage(text, sender) {

    const message = document.createElement("div");

    message.className = "message";


    const avatar = document.createElement("div");

    avatar.className =

    sender === "user"

    ? "avatar user-avatar"

    : "avatar bot-avatar";


    avatar.textContent =

    sender === "user"

    ? "YOU"

    : "AI";


    const content = document.createElement("div");

    content.className = "message-content";

    content.textContent = text;


    message.appendChild(avatar);

    message.appendChild(content);


    messages.appendChild(message);


    messages.scrollTop =
    messages.scrollHeight;


    return content;

}


async function sendMessage() {

    const userMessage =
    input.value.trim();


    if (!userMessage) {

        return;

    }


    /* Remove welcome screen */

    if (welcome) {

        welcome.style.display = "none";

    }


    /* Show user message */

    addMessage(
        userMessage,
        "user"
    );


    input.value = "";

    input.style.height = "auto";


    sendButton.disabled = true;


    /* Show loading message */

    const loadingMessage =

    addMessage(
        "Thinking...",
        "bot"
    );


    try {

        const response =

        await fetch(
            API_URL,
            {

                method: "POST",

                headers: {

                    "Content-Type":
                    "application/json"

                },

                body:

                JSON.stringify({

                    message:
                    userMessage

                })

            }

        );


        if (!response.ok) {

            throw new Error(

                "Server error"

            );

        }


        const data =

        await response.json();


        /*
        Change this if your backend
        uses another response name.

        Supported examples:

        {
        "response": "Hello"
        }

        {
        "message": "Hello"
        }

        {
        "reply": "Hello"
        }

        */


        loadingMessage.textContent =

        data.response

        ||

        data.message

        ||

        data.reply

        ||

        "The AI did not return a response.";


    }

    catch(error) {

        console.error(error);


        loadingMessage.textContent =

        "Unable to connect to the AI backend. "
        +
        "Please check whether the backend "
        +
        "is running.";

    }


    sendButton.disabled = false;


    input.focus();

}


function newChat() {

    messages.innerHTML = "";

    location.reload();

}

</script>

</body>
</html>
